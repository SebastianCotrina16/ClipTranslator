[project]
name = "cliptranslator"
version = "0.2.0"
description = "App for detecting and translating languages in video and audio clips"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "numpy>=2.0",
    "soundfile>=0.13",
    "imageio-ffmpeg>=0.6",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.20,<1.27",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
cpu = [
    "onnxruntime>=1.20",
]

[project.scripts]
cliptranslator = "app.presentation.cli:main"
cliptranslator-setup = "app.presentation.wizard:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

[[tool.uv.dependency-metadata]]
name = "faster-whisper"
version = "1.2.1"
requires-dist = [
    "ctranslate2>=4.0,<5",
    "huggingface-hub>=0.21",
    "tokenizers>=0.13,<1",
    "av>=11",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N", "RET", "PTH"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
